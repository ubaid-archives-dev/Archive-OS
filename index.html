<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SystemOS - Archive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="desktop">
    <!-- Solo Leveling Style Window -->
    <div class="os-window holographic" id="window-1">
      <div class="title-bar" id="title-bar-1">
        <span>[ SYSTEM NOTIFICATION ]</span>
        <button class="close-btn">[ X ]</button>
      </div>
      <div class="window-content">
        <h2>WELCOME, PLAYER.</h2>
        <p>The system has been initialized. Your archive is ready.</p>
      </div>
    </div>
  </main>

  <footer id="taskbar">
    <button id="start-btn">► AWAKEN</button>
    <div class="taskbar-apps">
      <!-- App icons will go here -->
    </div>
    <div id="clock">00:00:00</div>
  </footer>

</body>
</html>
